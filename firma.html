<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Generador de Firma HTML con Vista Previa y Descarga de Imagen</title>
<style>
  body{font-family:Arial, sans-serif; margin:20px; background:#f5f5f5; color:#333}
  h2,h3{margin-bottom:10px; color:#007bff}
  label{display:block; margin-top:10px; font-weight:700; color:#555}
  input{width:300px; padding:8px; margin-top:4px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box}
  .preview-box{margin-top:20px; padding:15px; background:#fff; border:1px solid #ccc; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,.1); display:inline-block}
  button{margin-top:15px; padding:10px 20px; background:#007bff; color:#fff; border:0; border-radius:5px; cursor:pointer; font-size:16px}
  button:hover{background:#0056b3}
</style>
</head>
<body>

<h2>Generador de Firma de Correo</h2>

<form id="firmaForm">
  <label for="nombre">Nombre completo:</label>
  <input type="text" id="nombre" placeholder="Ej: Héctor Aburto" oninput="actualizarVista()">
  <label for="cargo">Cargo:</label>
  <input type="text" id="cargo" placeholder="Ej: Soporte IT" oninput="actualizarVista()">
  <label for="telefono">Teléfono:</label>
  <input type="text" id="telefono" placeholder="Ej: +56 9 0000 0000" oninput="actualizarVista()">
  <label for="correo">Correo electrónico:</label>
  <input type="text" id="correo" placeholder="Ej: hector@ejemplo.com" oninput="actualizarVista()">
  <label for="direccion">Dirección:</label>
  <input type="text" id="direccion" placeholder="Ej: Napoleón #3565, Oficina 904, Las Condes, Santiago - Chile" oninput="actualizarVista()">
</form>

<h3>Vista previa:</h3>
<div id="preview" class="preview-box"></div>

<button onclick="descargarImagen()">📷 Descargar firma optimizada</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
function actualizarVista(){
  const nombre = document.getElementById("nombre").value || "Tu Nombre";
  const cargo  = document.getElementById("cargo").value  || "Tu Cargo";
  const telefono = document.getElementById("telefono").value || "+56 9 0000 0000";
  const correo = document.getElementById("correo").value || "correo@ejemplo.com";
  const direccion = document.getElementById("direccion").value || "Napoleón #3565, Oficina 904, Las Condes, Santiago - Chile";

  const web  = "https://paragon-chile.cl/project";
  const logo = "img/brand/logo_paragon_vector.png";

  const firmaHTML = `
<table cellpadding="0" cellspacing="0" style="font-family:Arial, Helvetica, sans-serif; font-size:1px; color:#222; line-height:1.3;">
  <tr>
    <td style="vertical-align:middle; padding-right:12px;">
      <img src="${logo}" alt="Logo" width="160" style="display:block; border:0; outline:none; text-decoration:none;" crossOrigin="anonymous"/>
    </td>
    <td style="vertical-align:middle;">
      <div style="font-size:16px; font-weight:700; color:#111;">${nombre}</div>
      <div style="font-size:13px; margin:2px 0 6px 0; color:#555;">${cargo}</div>
      <table cellpadding="0" cellspacing="0" style="font-size:13px; color:#333;">
        <tr>
          <td style="padding-right:8px;">📞</td>
          <td><a href="tel:${telefono}" style="color:#1a73e8; text-decoration:none;">${telefono}</a></td>
        </tr>
        <tr>
          <td style="padding-right:8px;">✉️</td>
          <td><a href="mailto:${correo}" style="color:#1a73e8; text-decoration:none;">${correo}</a></td>
        </tr>
        <tr>
          <td style="padding-right:8px;">📍</td>
          <td>${direccion}</td>
        </tr>
        <tr>
          <td style="padding-right:8px;">🌐</td>
          <td><a href="${web}" style="color:#1a73e8; text-decoration:none;">${web}</a></td>
        </tr>
        <tr>
          <td style="padding-right:8px;">
            <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" alt="LinkedIn" width="18" style="display:inline-block; border:0;" crossOrigin="anonymous"/>
          </td>
          <td><a href="https://www.linkedin.com/company/paragonprojectpartners" style="color:#1a73e8; text-decoration:none;">https://www.linkedin.com/company/paragonprojectpartners</a></td>
        </tr>
      </table>
    </td>
  </tr>
</table>
`.trim();

  document.getElementById("preview").innerHTML = firmaHTML;
}

function descargarImagen(){
  const previewDiv = document.getElementById('preview');
  html2canvas(previewDiv, {
    scale: 1.3,          // más grande y nítido
    useCORS: true,
    backgroundColor: '#ffffff'
  }).then(canvas=>{
    const link = document.createElement('a');
    link.download = 'firma.jpg'; 
    link.href = canvas.toDataURL('image/jpeg', 0.8); // JPG optimizado
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }).catch(err=>{
    console.error('Error al generar la imagen:', err);
    alert('Ocurrió un error al intentar descargar la imagen.');
  });
}

actualizarVista();
</script>
</body>
</html>
